<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" role="img" aria-label="Life+">
  <title>Life+ Serviços Médicos</title>
  <defs>
    <linearGradient id="lp-navy" x1="16" y1="16" x2="60" y2="84" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2C417E" />
      <stop offset="0.52" stop-color="#22335F" />
      <stop offset="1" stop-color="#141F46" />
    </linearGradient>
    <linearGradient id="lp-teal" x1="52" y1="18" x2="84" y2="62" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#48E0CB" />
      <stop offset="0.55" stop-color="#22C4AE" />
      <stop offset="1" stop-color="#0B9C85" />
    </linearGradient>
    <linearGradient id="lp-plus" x1="56" y1="28" x2="92" y2="66" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#63EBD9" />
      <stop offset="0.5" stop-color="#38D3BD" />
      <stop offset="1" stop-color="#1CB39D" />
    </linearGradient>
  </defs>

  <!-- coração em fita: lado esquerdo em azul-marinho institucional -->
  <path
    d="M48 82C24 65 10 52 10 37 10 25 19 16 30.5 16c7.5 0 13.5 4 17.5 10 4-6 10-10 17.5-10C77 16 86 25 86 37c0 15-14 28-38 45Z"
    fill="none" stroke="url(#lp-navy)" stroke-width="13" stroke-linejoin="round" stroke-linecap="round"
  />
  <!-- fita verde-água descendo pelo lobo direito -->
  <path
    d="M52 23.5C55.6 19 60.4 16 65.5 16 77 16 86 25 86 37c0 7.6-3.7 14.6-10 21.4"
    fill="none" stroke="url(#lp-teal)" stroke-width="13" stroke-linejoin="round" stroke-linecap="round"
  />
  <!-- cruz Life+ -->
  <path
    d="M72.5 30V64M56 47H89"
    fill="none" stroke="url(#lp-plus)" stroke-width="12" stroke-linecap="round"
  />
</svg>
